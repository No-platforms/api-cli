# Production nginx (deploy-nginx-1): server block for rel.ariantamin.ir.
# Copy to /root/deploy/nginx/conf.d/rel.ariantamin.ir.conf, then:
#   docker exec deploy-nginx-1 nginx -t && docker exec deploy-nginx-1 nginx -s reload
#
# Only the WAF (92.119.58.11) may reach this host. The WAF's connection address is
# checked with $realip_remote_addr, because `allow` would compare the client IP
# after the real-IP step and block everyone.

server {
    listen 80;
    server_name rel.ariantamin.ir;

    set_real_ip_from 92.119.58.11;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    if ($realip_remote_addr != 92.119.58.11) {
        return 403;
    }

    client_max_body_size 1k;

    # Service listens on the deploy_default gateway (172.18.0.1), not on a public address.
    location = /health {
        proxy_pass http://172.18.0.1:3400/health;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://172.18.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, do not append: the client IP is what the service must rate-limit on.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 2400s;
    }

    location / {
        return 404;
    }
}
